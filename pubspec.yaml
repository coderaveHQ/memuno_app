name: memuno_app
description: "Make memes fast: pick a template, add your caption, and send it to friends instantly."

# Prevent accidental publishing to pub.dev
publish_to: "none"

# App version: <major>.<minor>.<patch>+<build>
# NOTE:
# - The SemVer part (<major>.<minor>.<patch>) is managed by Release Please.
# - The build number (+<build>) is injected by CI via --build-number (GitHub run_number).
version: 1.0.0

environment:
  # Dart SDK constraint
  sdk: ^3.10.7

dependencies:
  # --- Flutter SDK -----------------------------------------------------------
  flutter:
    sdk: flutter

  # --- Localization & Internationalization -----------------------------------
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- Local persistence -----------------------------------------------------
  shared_preferences: ^2.5.3

  # --- Backend / API ---------------------------------------------------------
  supabase_flutter: ^2.12.0

  # --- Firebase --------------------------------------------------------------
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7

  # --- State management / DI -------------------------------------------------
  riverpod: ^3.2.0
  hooks_riverpod: ^3.2.0

  # --- Routing / Navigation --------------------------------------------------
  go_router: ^17.0.1

  # --- Deep links ------------------------------------------------------------
  app_links: ^7.0.0

  # --- UI / Design system ----------------------------------------------------
  zentoast: ^0.2.1
  flutter_lucide: ^1.8.2
  gap: ^3.0.1
  skeletonizer: ^2.1.3
  pinput: ^6.0.1
  flutter_staggered_grid_view: ^0.7.0

  # --- Hooks -----------------------------------------------------------------
  flutter_hooks: ^0.21.3+1

  # --- Sharing / Platform utilities -----------------------------------------
  share_plus: ^12.0.1

  # --- Codegen annotations (runtime deps) ------------------------------------
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.1

dev_dependencies:
  # --- Testing ---------------------------------------------------------------
  flutter_test:
    sdk: flutter

  # --- Linting / Static analysis --------------------------------------------
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.2

  # --- Code generation -------------------------------------------------------
  build_runner: ^2.10.5
  riverpod_generator: ^4.0.2
  go_router_builder: ^4.1.3
  json_serializable: ^6.11.4
  freezed: ^3.2.4

flutter:
  # Enable translation generation
  generate: true

  # Enable Material icons font
  uses-material-design: true

  # Custom fonts
  fonts:
    - family: Switzer
      fonts:
        - asset: assets/fonts/Switzer-Black.otf
        - asset: assets/fonts/Switzer-BlackItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Bold.otf
        - asset: assets/fonts/Switzer-BoldItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Extrabold.otf
        - asset: assets/fonts/Switzer-ExtraboldItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Extralight.otf
        - asset: assets/fonts/Switzer-ExtralightItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Italic.otf
          style: italic
        - asset: assets/fonts/Switzer-Light.otf
        - asset: assets/fonts/Switzer-LightItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Medium.otf
        - asset: assets/fonts/Switzer-MediumItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Regular.otf
        - asset: assets/fonts/Switzer-Semibold.otf
        - asset: assets/fonts/Switzer-SemiboldItalic.otf
          style: italic
        - asset: assets/fonts/Switzer-Thin.otf
        - asset: assets/fonts/Switzer-ThinItalic.otf
          style: italic

dependency_overrides:
  # Temporary overrides
  analyzer: ^10.0.1
  app_links: ^7.0.0
  analyzer_plugin: ^0.14.1
