<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url={{target_url}}" />
    <title>Redirecting...</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --surface: #0f0f12;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --line: #27272a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at top right, rgba(63, 63, 70, 0.28) 0, transparent 46%),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      p {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--text-muted);
      }

      a {
        color: var(--text);
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="{{target_url}}">{{target_url}}</a>...</p>
  </body>
</html>
