<!doctype html>
<html lang="{{lang_attr}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{page_title}} | {{site_name}}</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --surface: #0f0f12;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-soft: #d4d4d8;
        --line: #27272a;
        --line-strong: #3f3f46;
        --success: #86efac;
        --danger: #fca5a5;
        --danger-bg: #7f1d1d;
        --danger-bg-hover: #991b1b;
        --danger-border: #b91c1c;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(63, 63, 70, 0.28) 0, transparent 46%),
          radial-gradient(circle at -5% 120%, rgba(39, 39, 42, 0.42) 0, transparent 44%),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .card {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
        letter-spacing: -0.025em;
      }

      p {
        margin: 0 0 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      button {
        width: 100%;
        border: 1px solid var(--danger-border);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        font-weight: 600;
        background: var(--danger-bg);
        color: var(--text);
        cursor: pointer;
        transition:
          background-color 0.18s ease,
          transform 0.18s ease;
      }

      button:hover:not(:disabled) {
        background: var(--danger-bg-hover);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .status {
        min-height: 1.4em;
        margin-top: 12px;
        color: var(--text-muted);
      }

      .status-success {
        color: var(--success);
        font-weight: 500;
      }

      .status-error {
        color: var(--danger);
        font-weight: 500;
      }

      .back-link {
        margin-top: 14px;
      }

      .back-link a {
        color: var(--text-soft);
        text-underline-offset: 2px;
      }

      .back-link a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>{{page_title}}</h1>
        <p>{{intro}}</p>
        <button id="delete-button" type="button" disabled>
          {{delete_button_label}}
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="back-link">
          <a href="{{account_deletion_doc_url}}">{{back_link_label}}</a>
        </p>
      </section>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = {{supabase_url_json}};
      const supabasePublishableKey = {{supabase_publishable_key_json}};
      const deleteEndpointUrl = {{delete_endpoint_url_json}};
      const loadingMessage = {{loading_message_json}};
      const readyMessage = {{ready_message_json}};
      const notVerifiedMessage = {{not_verified_message_json}};
      const verifyFailedMessage = {{verify_failed_message_json}};
      const deletingLabel = {{deleting_label_json}};
      const deletedMessage = {{deleted_message_json}};
      const deleteFailedMessage = {{delete_failed_message_json}};
      const initialDeleteLabel = {{delete_button_label_json}};

      const deleteButton = document.getElementById("delete-button");
      const status = document.getElementById("status");

      let currentSession = null;

      const supabase = createClient(supabaseUrl, supabasePublishableKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      });

      function setStatus(message, tone) {
        status.textContent = message;
        status.classList.remove("status-success", "status-error");
        if (tone === "success") {
          status.classList.add("status-success");
        } else if (tone === "error") {
          status.classList.add("status-error");
        }
      }

      async function ensureSession() {
        const sessionResult = await supabase.auth.getSession();
        if (sessionResult.error == null && sessionResult.data.session != null) {
          return { session: sessionResult.data.session, error: null };
        }

        const url = new URL(window.location.href);
        const code = url.searchParams.get("code");
        if (code != null && code.trim().length > 0) {
          const exchangeResult = await supabase.auth.exchangeCodeForSession(code);
          if (exchangeResult.error == null) {
            const refreshed = await supabase.auth.getSession();
            if (refreshed.data.session != null) {
              return { session: refreshed.data.session, error: null };
            }
          }
        }

        const tokenHash = url.searchParams.get("token_hash");
        const verificationType = url.searchParams.get("type");
        if (
          tokenHash != null &&
          tokenHash.trim().length > 0 &&
          verificationType != null &&
          verificationType.trim().length > 0
        ) {
          const verifyResult = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: verificationType,
          });
          if (verifyResult.error == null) {
            const refreshed = await supabase.auth.getSession();
            if (refreshed.data.session != null) {
              return { session: refreshed.data.session, error: null };
            }
          }
          return { session: null, error: verifyResult.error };
        }

        return { session: null, error: sessionResult.error };
      }

      async function init() {
        setStatus(loadingMessage, "neutral");

        try {
          const result = await ensureSession();
          if (result.session == null) {
            setStatus(
              result.error != null ? verifyFailedMessage : notVerifiedMessage,
              "error",
            );
            return;
          }

          currentSession = result.session;
          deleteButton.disabled = false;
          setStatus(readyMessage, "success");
        } catch (_error) {
          setStatus(verifyFailedMessage, "error");
        }
      }

      deleteButton.addEventListener("click", async () => {
        if (currentSession == null) {
          setStatus(notVerifiedMessage, "error");
          return;
        }

        deleteButton.disabled = true;
        deleteButton.textContent = deletingLabel;
        setStatus("", "neutral");

        try {
          const response = await fetch(deleteEndpointUrl, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${currentSession.access_token}`,
            },
          });

          if (!response.ok) {
            setStatus(deleteFailedMessage, "error");
            deleteButton.disabled = false;
            deleteButton.textContent = initialDeleteLabel;
            return;
          }

          await supabase.auth.signOut();
          setStatus(deletedMessage, "success");
          deleteButton.textContent = deletedMessage;
        } catch (_error) {
          setStatus(deleteFailedMessage, "error");
          deleteButton.disabled = false;
          deleteButton.textContent = initialDeleteLabel;
        }
      });

      init();
    </script>
  </body>
</html>
