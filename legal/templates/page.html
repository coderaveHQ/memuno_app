<!doctype html>
<html lang="{{lang_attr}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{page_title}} | {{site_name}}</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --bg-glow: #18181b;
        --surface: #0f0f12;
        --surface-subtle: #111113;
        --surface-muted: #0b0b0d;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-soft: #d4d4d8;
        --line: #27272a;
        --line-strong: #3f3f46;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(63, 63, 70, 0.28) 0, transparent 46%),
          radial-gradient(circle at -5% 120%, rgba(39, 39, 42, 0.42) 0, transparent 44%),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        line-height: 1.55;
      }

      main {
        max-width: 1020px;
        margin: 0 auto;
        padding: 32px 16px 44px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      header h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 1.7rem);
        letter-spacing: -0.025em;
      }

      header p {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      nav {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      nav a {
        text-decoration: none;
        color: var(--text-soft);
        border: 1px solid var(--line);
        background: var(--surface-subtle);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.87rem;
        transition:
          border-color 0.18s ease,
          background-color 0.18s ease,
          color 0.18s ease;
      }

      nav a:hover {
        color: var(--text);
        border-color: var(--line-strong);
        background: #151518;
      }

      nav a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      article {
        margin-top: 22px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      article h2,
      article h3 {
        margin: 22px 0 10px;
        letter-spacing: -0.02em;
      }

      article h2 {
        font-size: 1.18rem;
      }

      article h3 {
        font-size: 1.04rem;
      }

      article h4 {
        margin: 18px 0 8px;
        color: var(--text-soft);
        font-size: 0.97rem;
      }

      article p {
        margin: 0 0 12px;
        color: var(--text-soft);
      }

      article ul,
      article ol {
        color: var(--text-soft);
        margin-top: 0;
        margin-bottom: 12px;
        padding-left: 22px;
      }

      article li + li {
        margin-top: 6px;
      }

      article a {
        color: var(--text);
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }

      article a:hover {
        color: var(--text-soft);
      }

      code {
        background: var(--surface-muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 7px;
        color: var(--text-soft);
        font-family:
          'SF Mono',
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          'Liberation Mono',
          'Courier New',
          monospace;
      }

      footer {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      footer a {
        color: var(--text-soft);
      }

      footer a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <header>
          <h1>{{page_title}}</h1>
          <p>{{site_name}} | {{locale}} | v{{version}} | {{effective_date}}</p>
        </header>
        <nav>
          {{nav_links}}
        </nav>
        <article>
          {{content_html}}
        </article>
        <footer>
          <p>Support: <a href="mailto:{{support_email}}">{{support_email}}</a> | {{support_phone}}</p>
          <p>Privacy contact: <a href="mailto:{{privacy_contact_email}}">{{privacy_contact_email}}</a></p>
          <p>{{legal_entity}} | {{legal_address}}</p>
          <p>
            Data deletion endpoint:
            <a href="{{deletion_request_url}}">{{deletion_request_url}}</a>
          </p>
        </footer>
      </section>
    </main>
  </body>
</html>
