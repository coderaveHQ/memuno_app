name: Sync production -> staging

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: sync-production-to-staging
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: Rebase-sync staging onto production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Rebase-sync target branch
        env:
          SOURCE_BRANCH: production
          TARGET_BRANCH: staging
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          git fetch origin "${SOURCE_BRANCH}" "${TARGET_BRANCH}"

          SOURCE_REF="origin/${SOURCE_BRANCH}"
          TARGET_REF="origin/${TARGET_BRANCH}"

          SOURCE_SHA="$(git rev-parse "${SOURCE_REF}")"
          TARGET_SHA="$(git rev-parse "${TARGET_REF}")"
          MERGE_BASE_SHA="$(git merge-base "${TARGET_REF}" "${SOURCE_REF}")"

          echo "source=${SOURCE_REF} (${SOURCE_SHA})"
          echo "target=${TARGET_REF} (${TARGET_SHA})"
          echo "merge-base=${MERGE_BASE_SHA}"

          if [[ "${SOURCE_SHA}" == "${TARGET_SHA}" ]]; then
            echo "Branches are already identical."
            exit 0
          fi

          if git merge-base --is-ancestor "${SOURCE_REF}" "${TARGET_REF}"; then
            echo "Target already contains source. No sync needed."
            exit 0
          fi

          if git merge-base --is-ancestor "${TARGET_REF}" "${SOURCE_REF}"; then
            echo "Fast-forwarding target to source."
            git checkout -B "${TARGET_BRANCH}" "${SOURCE_REF}"
          else
            echo "Branches diverged. Rebasing target-only commits onto source."
            git checkout -B "${TARGET_BRANCH}" "${TARGET_REF}"
            git rebase --onto "${SOURCE_REF}" "${MERGE_BASE_SHA}" "${TARGET_BRANCH}"
          fi

          NEW_TARGET_SHA="$(git rev-parse "${TARGET_BRANCH}")"
          echo "new-target=${NEW_TARGET_SHA}"

          if [[ "${NEW_TARGET_SHA}" == "${TARGET_SHA}" ]]; then
            echo "No branch update required after rebase."
            exit 0
          fi

          git push --force-with-lease="${TARGET_BRANCH}:${TARGET_SHA}" origin "${TARGET_BRANCH}:${TARGET_BRANCH}"
          echo "Updated ${TARGET_BRANCH} to ${NEW_TARGET_SHA}."
