<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontolöschung anfragen | Memuno (Staging)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --surface: #0f0f12;
        --surface-subtle: #111113;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-soft: #d4d4d8;
        --line: #27272a;
        --line-strong: #3f3f46;
        --success: #86efac;
        --danger: #fca5a5;
        --danger-bg: #1f1010;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(63, 63, 70, 0.28) 0, transparent 46%),
          radial-gradient(circle at -5% 120%, rgba(39, 39, 42, 0.42) 0, transparent 44%),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .card {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
        letter-spacing: -0.025em;
      }

      p {
        margin: 0 0 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      label {
        display: block;
        font-weight: 500;
        color: var(--text-soft);
        margin-bottom: 6px;
      }

      input[type='email'] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--surface-subtle);
        color: var(--text);
        font: inherit;
        margin-bottom: 12px;
      }

      input[type='email']::placeholder {
        color: var(--text-muted);
      }

      input[type='email']:focus-visible {
        border-color: var(--line-strong);
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        border: 1px solid var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        font-weight: 600;
        background: var(--text);
        color: var(--bg);
        cursor: pointer;
        transition:
          filter 0.18s ease,
          transform 0.18s ease;
      }

      button:hover:not(:disabled) {
        filter: brightness(0.94);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .status {
        min-height: 1.4em;
        margin-top: 12px;
        color: var(--text-muted);
      }

      .status-success {
        color: var(--success);
        font-weight: 500;
      }

      .status-error {
        color: var(--danger);
        font-weight: 500;
      }

      .back-link {
        margin-top: 14px;
      }

      .back-link a {
        color: var(--text-soft);
        text-underline-offset: 2px;
      }

      .back-link a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Kontolöschung anfragen</h1>
        <p>Geben Sie die E-Mail-Adresse Ihres Kontos ein. Falls ein Konto existiert, senden wir einen sicheren Bestätigungslink.</p>
        <form id="request-form" novalidate>
          <label for="email">E-Mail-Adresse</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="du@beispiel.de"
          />
          <button id="submit-button" type="submit">Bestätigungslink senden</button>
        </form>
        <p
          id="status"
          class="status"
          role="status"
          aria-live="polite"
          data-sending-label="Wird gesendet..."
          data-success-message="Falls ein Konto mit dieser E-Mail-Adresse existiert, wurde ein Bestätigungslink versendet. Aus Datenschutzgründen bleiben Sie auf dieser Seite."
          data-error-message="Die Anfrage konnte nicht gesendet werden. Bitte versuchen Sie es erneut."
          data-default-label="Bestätigungslink senden"
        ></p>
        <p class="back-link">
          <a href="https://coderavehq.github.io/memuno_app/staging/legal/de-DE/account-deletion/">Zurück zu den Infos zur Kontolöschung</a>
        </p>
      </section>
    </main>
    <script>
      const requestEndpointUrl = "https://bhwsuraepcmnurgqvuzj.supabase.co/functions/v1/request-account-deletion-link";
      const locale = "de-DE";

      const form = document.getElementById("request-form");
      const emailInput = document.getElementById("email");
      const submitButton = document.getElementById("submit-button");
      const status = document.getElementById("status");

      function setStatus(message, tone) {
        status.textContent = message;
        status.classList.remove("status-success", "status-error");
        if (tone === "success") {
          status.classList.add("status-success");
        } else if (tone === "error") {
          status.classList.add("status-error");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = (emailInput.value || "").trim();
        if (email.length === 0 || !emailInput.checkValidity()) {
          setStatus(status.dataset.errorMessage || "", "error");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = status.dataset.sendingLabel || submitButton.textContent;
        setStatus("", "neutral");

        try {
          const response = await fetch(requestEndpointUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              locale,
            }),
          });

          if (!response.ok) {
            setStatus(status.dataset.errorMessage || "", "error");
          } else {
            setStatus(status.dataset.successMessage || "", "success");
            form.reset();
          }
        } catch (_error) {
          setStatus(status.dataset.errorMessage || "", "error");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = status.dataset.defaultLabel || submitButton.textContent;
        }
      });
    </script>
  </body>
</html>
